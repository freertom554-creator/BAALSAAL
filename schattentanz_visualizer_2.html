<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCHATTENTANZ — Visualizer</title>
<style>
  :root{
    --bg:#040507; --panel:#0a0d12; --panel-2:#10151d; --line:#1a2530;
    --steel:#2b6cb0; --ice:#6db8ff; --ink:#e8eef4; --muted:#5f7186; --danger:#c65a5a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Arial,sans-serif;
    display:flex;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
  .rail{width:230px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
  .brand{padding:20px 18px 16px;border-bottom:1px solid var(--line)}
  .brand h1{font-size:15px;font-weight:700;letter-spacing:4px}
  .brand span{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
  .rail-label{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;padding:14px 18px 8px;display:flex;justify-content:space-between}
  .rail-label b{color:var(--steel)}
  .templates{overflow-y:auto;flex:1;padding:0 10px 16px}
  .cat{font-size:9px;letter-spacing:2px;color:var(--steel);text-transform:uppercase;padding:12px 10px 4px;opacity:.8}
  .tpl{display:flex;align-items:center;gap:10px;padding:8px 10px;margin:2px 0;border-radius:6px;cursor:pointer;
    font-size:12.5px;color:var(--muted);border:1px solid transparent;transition:all .12s;letter-spacing:.3px}
  .tpl:hover{background:var(--panel-2);color:var(--ink)}
  .tpl.active{background:var(--panel-2);color:var(--ice);border-color:var(--steel)}
  .tpl .num{font-size:10px;color:var(--muted);width:20px;flex-shrink:0}
  .tpl.active .num{color:var(--steel)}
  .stage-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;min-width:0;
    background:radial-gradient(circle at 50% 40%,#080b10 0%,var(--bg) 70%)}
  #stage{background:#000;display:block;box-shadow:0 20px 80px rgba(0,0,0,.7),0 0 0 1px var(--line);max-height:100%;max-width:100%;border-radius:2px}
  .drop-hint{position:absolute;inset:24px;border:1px dashed var(--line);border-radius:2px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:8px;color:var(--muted);pointer-events:none;text-align:center;transition:opacity .2s}
  .drop-hint.hide{opacity:0}
  .drop-hint b{color:var(--ink);font-weight:600;letter-spacing:1px;font-size:15px}
  .drop-hint small{font-size:11px;letter-spacing:1px}
  .stage-wrap.dragover .drop-hint{border-color:var(--ice);color:var(--ice)}
  .controls{width:270px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
  .grp{padding:16px 18px;border-bottom:1px solid var(--line)}
  .grp h3{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:12px}
  .btn{width:100%;padding:11px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;color:var(--ink);
    font-size:12px;letter-spacing:1px;cursor:pointer;transition:all .12s;text-transform:uppercase;font-weight:600}
  .btn:hover{border-color:var(--steel);color:var(--ice)}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .btn.primary{background:var(--steel);border-color:var(--steel);color:#fff}
  .btn.primary:hover{background:#3579c0}
  .btn.rec{background:transparent;border-color:var(--danger);color:var(--danger)}
  .btn.rec.active{background:var(--danger);color:#fff}
  .row{display:flex;gap:8px}
  .seg{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:8px;border:1px solid var(--line)}
  .seg button{flex:1;padding:8px 4px;background:transparent;border:none;color:var(--muted);font-size:11px;cursor:pointer;border-radius:5px;letter-spacing:.5px;transition:all .12s}
  .seg button.active{background:var(--panel-2);color:var(--ice)}
  label.field{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;letter-spacing:.5px}
  input[type=text]{width:100%;padding:9px 10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--ink);font-size:12px;letter-spacing:.5px}
  input[type=text]:focus{outline:none;border-color:var(--steel)}
  .toggle{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ink);margin-top:12px}
  .switch{position:relative;width:38px;height:20px;flex-shrink:0}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:var(--line);border-radius:20px;cursor:pointer;transition:.2s}
  .slider:before{content:"";position:absolute;width:14px;height:14px;left:3px;top:3px;background:var(--muted);border-radius:50%;transition:.2s}
  .switch input:checked + .slider{background:var(--steel)}
  .switch input:checked + .slider:before{transform:translateX(18px);background:#fff}
  input[type=range]{width:100%;accent-color:var(--steel);margin-top:6px}
  .transport{padding:16px 18px;border-bottom:1px solid var(--line)}
  .time{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:8px;letter-spacing:1px;font-variant-numeric:tabular-nums}
  .status{font-size:10px;color:var(--muted);padding:12px 18px;letter-spacing:.5px;line-height:1.5}
  .status.rec{color:var(--danger)}
  .hidden-file{display:none}
  ::-webkit-scrollbar{width:8px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
</style>
</head>
<body>
  <div class="rail">
    <div class="brand"><h1>SCHATTENTANZ</h1><span>Visualizer</span></div>
    <div class="rail-label">Templates <b id="tplCount"></b></div>
    <div class="templates" id="tplList"></div>
  </div>

  <div class="stage-wrap" id="stageWrap">
    <canvas id="stage" width="1080" height="1920"></canvas>
    <div class="drop-hint" id="dropHint">
      <b>Track hier reinziehen</b>
      <small>oder klicken · MP3 / WAV / M4A</small>
    </div>
  </div>

  <div class="controls">
    <div class="transport">
      <div class="row">
        <button class="btn primary" id="playBtn" disabled>▶ Play</button>
        <button class="btn" id="loadBtn" style="width:auto;padding-left:16px;padding-right:16px">Track</button>
      </div>
      <input type="range" id="seek" min="0" max="1000" value="0" disabled>
      <div class="time"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
    </div>
    <div class="grp"><h3>Format</h3>
      <div class="seg" id="fmtSeg">
        <button data-fmt="vertical" class="active">9:16</button>
        <button data-fmt="square">1:1</button>
        <button data-fmt="wide">16:9</button>
      </div>
    </div>
    <div class="grp"><h3>Look</h3>
      <div class="toggle"><span>Ice-Glow (Signature)</span><label class="switch"><input type="checkbox" id="glowOn" checked><span class="slider"></span></label></div>
      <div class="toggle"><span>Grain / Vignette</span><label class="switch"><input type="checkbox" id="showGrain" checked><span class="slider"></span></label></div>
      <div class="toggle"><span>Auto-Rotation</span><label class="switch"><input type="checkbox" id="autoRot" checked><span class="slider"></span></label></div>
    </div>
    <div class="grp"><h3>Overlay</h3>
      <label class="field">Track-Titel</label>
      <input type="text" id="titleInput" placeholder="REALITÄTSFRAGMENTE" value="REALITÄTSFRAGMENTE">
      <div class="toggle"><span>Wordmark anzeigen</span><label class="switch"><input type="checkbox" id="showWordmark" checked><span class="slider"></span></label></div>
    </div>
    <div class="grp"><h3>Intensität</h3>
      <label class="field">Reaktivität</label>
      <input type="range" id="gainSlider" min="50" max="220" value="110">
    </div>
    <div class="grp"><h3>Presets</h3>
      <div class="row"><input type="text" id="presetName" placeholder="Preset-Name" style="flex:1"></div>
      <button class="btn" id="presetSaveBtn" style="margin-top:8px">Preset speichern</button>
      <div id="presetList" style="margin-top:10px;display:flex;flex-direction:column;gap:6px"></div>
    </div>
    <div class="grp"><h3>Export</h3>
      <label class="field">Aufnahmedauer</label>
      <div class="seg" id="durSeg" style="margin-bottom:12px">
        <button data-dur="0" class="active">Manuell</button>
        <button data-dur="15">15s</button>
        <button data-dur="30">30s</button>
      </div>
      <div class="toggle" style="margin-top:0"><span>Als MP4 exportieren</span><label class="switch"><input type="checkbox" id="mp4Toggle"><span class="slider"></span></label></div>
      <button class="btn rec" id="recBtn" disabled style="margin-top:14px">● Aufnahme starten</button>
      <div class="status" id="status">Lade einen Track, um zu starten.</div>
    </div>
  </div>

  <input type="file" id="fileInput" class="hidden-file" accept="audio/*">

<script>
/* ============================================================
   SCHATTENTANZ VISUALIZER — line-art / wireframe / generative
   Locked identity: white line-art on black + ice-blue glow signature.
   ============================================================ */
const C={bg:'#040507',ink:[232,238,244],steel:'#2b6cb0',ice:'#6db8ff'};
const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d');
let W=canvas.width,H=canvas.height;
const FORMATS={vertical:{w:1080,h:1920},square:{w:1080,h:1080},wide:{w:1920,h:1080}};

// audio
let audioCtx,analyser,sourceNode,mediaDest,gainNode,audioBuffer=null,startTime=0,pauseOffset=0,playing=false;
let freqData,waveData,smoothBass=0,smoothMid=0,smoothHigh=0,beat=0,userGain=1.1,trackName='';
let glowEnabled=true,autoRotate=true;

// UI
const $=id=>document.getElementById(id);
const playBtn=$('playBtn'),recBtn=$('recBtn'),seek=$('seek'),tCur=$('tCur'),tDur=$('tDur'),
      statusEl=$('status'),dropHint=$('dropHint'),titleInput=$('titleInput'),
      showWordmark=$('showWordmark'),showGrain=$('showGrain'),gainSlider=$('gainSlider'),
      presetNameInput=$('presetName'),presetSaveBtn=$('presetSaveBtn'),presetListEl=$('presetList'),
      durSeg=$('durSeg'),mp4Toggle=$('mp4Toggle');

/* ---------- DRAW HELPERS ---------- */
function lc(a){return `rgba(${C.ink[0]},${C.ink[1]},${C.ink[2]},${a})`;}     // line colour (white)
function ic(a){return `rgba(109,184,255,${a})`;}                             // ice accent
function glow(px){ if(glowEnabled&&px){ctx.shadowBlur=px;ctx.shadowColor=C.ice;} else {ctx.shadowBlur=0;} }
function noglow(){ctx.shadowBlur=0;}
// 3D rotate around Y then X, returns [x,y,z]
function rot(x,y,z,ax,ay){
  const cy=Math.cos(ay),sy=Math.sin(ay), x1=x*cy-z*sy, z1=x*sy+z*cy;
  const cx=Math.cos(ax),sx=Math.sin(ax), y1=y*cx-z1*sx, z2=y*cx*0+ (y*sx+z1*cx);
  return [x1,y1,z2];
}
// correct rotate (kept simple + right)
function rot3(x,y,z,ax,ay){
  let cy=Math.cos(ay),sy=Math.sin(ay); let X=x*cy-z*sy, Z=x*sy+z*cy;
  let cx=Math.cos(ax),sx=Math.sin(ax); let Y=y*cx-Z*sx; Z=y*sx+Z*cx;
  return [X,Y,Z];
}
// perspective project -> [sx,sy,scale]
function proj(x,y,z,cx,cy,f){ const s=f/(f+z); return [cx+x*s,cy+y*s,s]; }
// cheap hash-based value noise (no deps, fast enough for per-frame contour fields)
function noise2(x,y){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const h=(a,b)=>{const s=Math.sin(a*127.1+b*311.7)*43758.5453;return s-Math.floor(s);};
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=h(xi,yi),b=h(xi+1,yi),c=h(xi,yi+1),d=h(xi+1,yi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}

/* ---------- TEMPLATES ----------
   draw(g,w,h,f,wv,t,e)   e={bass,mid,high,beat}  rot = global rotation angle */
let ROT=0;
const TEMPLATES=[

/* ===== WIREFRAME / 3D ===== */
{cat:'Wireframe / 3D',name:'Wire Sphere',draw:(g,w,h,f,wv,t,e)=>{
  const cx=w/2,cy=h/2,foc=w*1.3,R=Math.min(w,h)*0.3*(1+e.bass*0.35);
  const LA=16,LO=24; g.lineWidth=1.4;
  glow(14);
  for(let i=0;i<=LA;i++){ // latitudes
    const lat=(i/LA-0.5)*Math.PI; g.beginPath();
    for(let j=0;j<=LO;j++){ const lon=j/LO*Math.PI*2;
      const [x,y,z]=rot3(R*Math.cos(lat)*Math.cos(lon),R*Math.sin(lat),R*Math.cos(lat)*Math.sin(lon),ROT*0.5,ROT);
      const[sx,sy]=proj(x,y,z,cx,cy,foc); j?g.lineTo(sx,sy):g.moveTo(sx,sy);}
    g.strokeStyle=lc(0.18+e.mid*0.4);g.stroke();
  }
  noglow();
  for(let j=0;j<LO;j+=2){ g.beginPath();
    for(let i=0;i<=LA;i++){ const lat=(i/LA-0.5)*Math.PI,lon=j/LO*Math.PI*2;
      const[x,y,z]=rot3(R*Math.cos(lat)*Math.cos(lon),R*Math.sin(lat),R*Math.cos(lat)*Math.sin(lon),ROT*0.5,ROT);
      const[sx,sy]=proj(x,y,z,cx,cy,foc); i?g.lineTo(sx,sy):g.moveTo(sx,sy);}
    g.strokeStyle=lc(0.1+e.high*0.25);g.stroke();
  }
}},

{cat:'Wireframe / 3D',name:'Torus',draw:(g,w,h,f,wv,t,e)=>{
  const cx=w/2,cy=h/2,foc=w*1.3,R=Math.min(w,h)*0.24,r=R*(0.38+e.bass*0.2);
  const N=30,M=16;g.lineWidth=1.3;glow(12);
  for(let i=0;i<N;i++){ g.beginPath();
    for(let j=0;j<=M;j++){ const u=i/N*Math.PI*2,v=j/M*Math.PI*2;
      const px=(R+r*Math.cos(v))*Math.cos(u),py=r*Math.sin(v),pz=(R+r*Math.cos(v))*Math.sin(u);
      const[x,y,z]=rot3(px,py,pz,ROT*0.7+0.5,ROT); const[sx,sy]=proj(x,y,z,cx,cy,foc);
      j?g.lineTo(sx,sy):g.moveTo(sx,sy);}
    g.strokeStyle=lc(0.16+e.high*0.4);g.stroke();
  } noglow();
}},

{cat:'Wireframe / 3D',name:'Gravity Well',draw:(g,w,h,f,wv,t,e)=>{ // grid warping into a centre sphere
  const cx=w/2,cy=h*0.52,foc=w*1.4,GS=w*0.9,N=22;
  const dip=Math.min(w,h)*(0.35+e.bass*0.5);
  g.lineWidth=1;
  const pt=(gx,gz)=>{ const dx=gx,dz=gz,d=Math.sqrt(dx*dx+dz*dz)+0.001;
    const y=dip/(1+d*0.06); const[x,yy,z]=rot3(gx,y,gz,0.9,ROT*0.15); return proj(x,yy,z,cx,cy,foc);};
  for(let i=0;i<=N;i++){ g.beginPath();
    for(let j=0;j<=N;j++){const[sx,sy]=pt((i/N-0.5)*GS,(j/N-0.5)*GS);j?g.lineTo(sx,sy):g.moveTo(sx,sy);}
    g.strokeStyle=lc(0.12+e.mid*0.25);g.stroke();}
  for(let j=0;j<=N;j++){ g.beginPath();
    for(let i=0;i<=N;i++){const[sx,sy]=pt((i/N-0.5)*GS,(j/N-0.5)*GS);i?g.lineTo(sx,sy):g.moveTo(sx,sy);}
    g.strokeStyle=lc(0.12+e.mid*0.25);g.stroke();}
  // centre sphere
  glow(20);g.strokeStyle=ic(0.6+e.beat*0.4);g.lineWidth=1.4;
  const sr=Math.min(w,h)*0.07*(1+e.bass*0.4);
  for(let k=0;k<5;k++){g.beginPath();g.ellipse(cx,cy+dip*0.02,sr,sr*(0.3+k*0.17),0,0,Math.PI*2);g.stroke();}
  noglow();
}},

{cat:'Wireframe / 3D',name:'Vortex Tunnel',draw:(g,w,h,f,wv,t,e)=>{
  const cx=w/2,cy=h/2;g.lineWidth=1.4;glow(10);
  for(let i=20;i>0;i--){ const p=((t*0.35+i)%20)/20,s=Math.pow(1-p,1.8);
    const r=Math.min(w,h)*0.6*s*(1+e.bass*0.25),sides=6,twist=ROT+i*0.25;
    g.beginPath();
    for(let k=0;k<=sides;k++){const a=k/sides*Math.PI*2+twist;const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;k?g.lineTo(x,y):g.moveTo(x,y);}
    g.strokeStyle=lc((1-p)*0.5+e.high*0.2);g.stroke();
  } noglow();
}},

/* ===== GENERATIVE ===== */
{cat:'Generative',name:'Phyllotaxis',draw:(g,w,h,f,wv,t,e)=>{ // fibonacci dot spiral (screenshot #7)
  const cx=w/2,cy=h/2,n=Math.floor(320+e.mid*260),gold=137.5*Math.PI/180,sc=Math.min(w,h)*0.032;
  glow(8);
  for(let i=0;i<n;i++){const a=i*gold+ROT*0.3,r=sc*Math.sqrt(i)*(1+e.bass*0.1);
    const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r,sz=1+i/n*3*(1+e.high);
    g.fillStyle=i>n-40?ic(0.8):lc(0.25+i/n*0.5);g.beginPath();g.arc(x,y,sz,0,Math.PI*2);g.fill();}
  noglow();
}},

{cat:'Generative',name:'Sacred Geometry',draw:(g,w,h,f,wv,t,e)=>{ // nested polygon + vertex circles (screenshot #6)
  const cx=w/2,cy=h/2,R=Math.min(w,h)*0.32*(1+e.bass*0.1),sides=7;g.lineWidth=1.4;glow(12);
  for(let ring=0;ring<3;ring++){const rr=R*(1-ring*0.28),rot=ROT*(ring%2?-1:1)*0.5;
    g.strokeStyle=lc(0.22+e.mid*0.35);g.beginPath();const pts=[];
    for(let k=0;k<sides;k++){const a=k/sides*Math.PI*2+rot;const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;pts.push([x,y]);k?g.lineTo(x,y):g.moveTo(x,y);}
    g.closePath();g.stroke();
    // star connections
    g.strokeStyle=lc(0.1);g.beginPath();
    for(let k=0;k<sides;k++){const[x1,y1]=pts[k],[x2,y2]=pts[(k+2)%sides];g.moveTo(x1,y1);g.lineTo(x2,y2);}g.stroke();
    if(ring===0){g.strokeStyle=ic(0.5+e.beat*0.4);pts.forEach(([x,y])=>{g.beginPath();g.arc(x,y,R*0.09*(1+e.beat*0.3),0,Math.PI*2);g.stroke();});}
  } noglow();
}},

{cat:'Generative',name:'Flow Strands',draw:(g,w,h,f,wv,t,e)=>{ // streamlines around a bright core (screenshot #8)
  const cx=w/2,cy=h/2;g.lineWidth=1;glow(6);
  for(let s=0;s<60;s++){const seed=s*12.9898;g.beginPath();
    let x=cx+Math.cos(seed)*Math.min(w,h)*0.4,y=cy+Math.sin(seed*1.3)*Math.min(w,h)*0.4;
    for(let i=0;i<40;i++){const ang=Math.atan2(cy-y,cx-x)+Math.sin((x+y)*0.004+t+seed)*1.4;
      const spd=6+e.mid*10; x+=Math.cos(ang)*spd; y+=Math.sin(ang)*spd; i?g.lineTo(x,y):g.moveTo(x,y);}
    g.strokeStyle=lc(0.08+e.high*0.3);g.stroke();}
  glow(30);g.fillStyle=ic(0.5+e.beat*0.4);g.beginPath();g.arc(cx,cy,Math.min(w,h)*0.03*(1+e.bass*0.5),0,Math.PI*2);g.fill();noglow();
}},

{cat:'Generative',name:'Constellation',draw:(g,w,h,f,wv,t,e)=>{ // particle network (screenshot #2)
  const cx=w/2,cy=h/2,n=54;if(!window._cst){window._cst=[];for(let i=0;i<n;i++)_cst.push({a:Math.random()*6.28,r:Math.random(),sp:0.2+Math.random()*0.5});}
  const pts=_cst.map(p=>{const rad=(0.15+p.r*0.32)*Math.min(w,h)*(1+e.bass*0.25);const a=p.a+ROT*p.sp*0.4;
    return [cx+Math.cos(a)*rad*1.4,cy+Math.sin(a)*rad];});
  g.lineWidth=0.8;g.strokeStyle=lc(0.15);
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const dx=pts[i][0]-pts[j][0],dy=pts[i][1]-pts[j][1],d=Math.hypot(dx,dy);
    if(d<Math.min(w,h)*0.16){g.globalAlpha=(1-d/(Math.min(w,h)*0.16))*(0.4+e.mid*0.4);g.beginPath();g.moveTo(pts[i][0],pts[i][1]);g.lineTo(pts[j][0],pts[j][1]);g.stroke();}}
  g.globalAlpha=1;glow(8);pts.forEach(([x,y])=>{g.fillStyle=ic(0.6);g.beginPath();g.arc(x,y,2+e.high*3,0,Math.PI*2);g.fill();});noglow();
}},

{cat:'Generative',name:'Cloth Mesh',draw:(g,w,h,f,wv,t,e)=>{ // flowing wireframe sheet (screenshot #1)
  const cx=w/2,cy=h/2,foc=w*1.6,GS=w*0.85,N=20;g.lineWidth=1;
  const pt=(i,j)=>{const gx=(i/N-0.5)*GS,gz=(j/N-0.5)*GS;
    const y=Math.sin(gx*0.006+t*1.2)*Math.min(w,h)*0.12+Math.cos(gz*0.007+t)*Math.min(w,h)*0.1*(1+e.bass);
    const[x,yy,z]=rot3(gx,y,gz,0.8,ROT*0.12);return proj(x,yy,z,cx,cy,foc);};
  glow(6);
  for(let i=0;i<=N;i++){g.beginPath();for(let j=0;j<=N;j++){const[sx,sy]=pt(i,j);j?g.lineTo(sx,sy):g.moveTo(sx,sy);}g.strokeStyle=lc(0.14+e.mid*0.3);g.stroke();}
  for(let j=0;j<=N;j++){g.beginPath();for(let i=0;i<=N;i++){const[sx,sy]=pt(i,j);i?g.lineTo(sx,sy):g.moveTo(sx,sy);}g.strokeStyle=lc(0.1);g.stroke();}
  noglow();
}},

{cat:'Generative',name:'Lissajous',draw:(g,w,h,f,wv,t,e)=>{
  const cx=w/2,cy=h/2,A=Math.min(w,h)*0.36,a=3+Math.floor(e.mid*3),b=2+Math.floor(e.high*3),d=t*0.4;
  g.lineWidth=1.6;glow(14);g.strokeStyle=ic(0.6+e.beat*0.3);g.beginPath();
  for(let i=0;i<=400;i++){const p=i/400*Math.PI*2;const x=cx+Math.sin(a*p+d)*A*(1+e.bass*0.1),y=cy+Math.sin(b*p)*A;i?g.lineTo(x,y):g.moveTo(x,y);}
  g.stroke();noglow();
}},

{cat:'Generative',name:'Harmonograph',draw:(g,w,h,f,wv,t,e)=>{
  const cx=w/2,cy=h/2,A=Math.min(w,h)*0.3;g.lineWidth=1;glow(8);g.strokeStyle=lc(0.25+e.mid*0.3);g.beginPath();
  const f1=2+e.bass,f2=3+e.high,p1=t*0.3,p2=t*0.21;
  for(let i=0;i<=2000;i++){const tt=i/2000*Math.PI*8;const dec=Math.exp(-tt*0.03);
    const x=cx+Math.sin(tt*f1+p1)*A*dec+Math.sin(tt*2.01)*A*0.3*dec;
    const y=cy+Math.sin(tt*f2+p2)*A*dec;i?g.lineTo(x,y):g.moveTo(x,y);}
  g.stroke();noglow();
}},

{cat:'Spectrum',name:'Bloom',draw:(g,w,h,f,wv,t,e)=>{

/* ===== WIREFRAME / 3D — Platonic + curved forms ===== */
{cat:'Wireframe / 3D',name:'Icosahedron',draw:(g,w,h,f,wv,t,e)=>{
  const cx=w/2,cy=h/2,foc=w*1.5,R=Math.min(w,h)*0.28*(1+e.bass*0.3),ph=(1+Math.sqrt(5))/2,nrm=Math.sqrt(1+ph*ph);
  const V=[[-1,ph,0],[1,ph,0],[-1,-ph,0],[1,-ph,0],[0,-1,ph],[0,1,ph],[0,-1,-ph],[0,1,-ph],[ph,0,-1],[ph,0,1],[-ph,0,-1],[-ph,0,1]];
  const E=[[0,1],[0,5],[0,7],[0,10],[0,11],[1,5],[1,7],[1,8],[1,9],[2,3],[2,4],[2,6],[2,10],[2,11],[3,4],[3,6],[3,8],[3,9],[4,5],[4,9],[4,11],[5,9],[5,11],[6,7],[6,8],[6,10],[7,8],[7,10],[8,9],[10,11]];
  const pts=V.map(([x,y,z])=>{const[rx,ry,rz]=rot3(x/nrm*R,y/nrm*R,z/nrm*R,ROT*0.6,ROT);return proj(rx,ry,rz,cx,cy,foc);});

{cat:'Wireframe / 3D',name:'Merkaba',draw:(g,w,h,f,wv,t,e)=>{

(()=>{

(()=>{

    for(let i=0;i<BINS;i++){
      const x=i*step+step*0.2,bw=step*0.6;
      for(let k=TRAIL-1;k>=0;k--){
        const v=hist[i][k],bh=v*h*0.6,y=h-bh,age=k/TRAIL;
        glow(k===0?12:0);
        g.fillStyle=k===0?(v>0.5?ic(0.85+e.beat*0.15):lc(0.7)):lc((1-age)*0.35);
        g.fillRect(x,y-k*3,bw,Math.max(1.5,bh-k*2));
      }
    }
    noglow();
  }};
})(),

(()=>{

/* ===== GENERATIVE — new ===== */
{cat:'Generative',name:'Superformula',draw:(g,w,h,f,wv,t,e)=>{
  const cx=w/2,cy=h/2,A=Math.min(w,h)*0.32,m=3+Math.floor(e.bass*6),n1=0.3+e.mid*3;
  g.lineWidth=1.4;glow(12);g.strokeStyle=lc(0.3+e.high*0.4);g.beginPath();
  for(let i=0;i<=300;i++){const th=i/300*Math.PI*2;
    const t1=Math.pow(Math.abs(Math.cos(m*th/4)),n1),t2=Math.pow(Math.abs(Math.sin(m*th/4)),n1);
    const r=Math.pow(t1+t2,-1/n1)*A,x=cx+Math.cos(th+ROT*0.2)*r,y=cy+Math.sin(th+ROT*0.2)*r;
    i?g.lineTo(x,y):g.moveTo(x,y);}
  g.stroke();glow(18);g.strokeStyle=ic(0.4+e.beat*0.5);g.beginPath();g.arc(cx,cy,4+e.beat*6,0,Math.PI*2);g.stroke();noglow();
}},

{cat:'Generative',name:'Wellen-Interferenz',draw:(g,w,h,f,wv,t,e)=>{
  const cx=w/2,cy=h/2,s1x=cx-w*0.15,s1y=cy,s2x=cx+w*0.15,s2y=cy,cols=72,rows=Math.round(cols*h/w);
  const freq=0.06+e.mid*0.03;
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const px=x/cols*w,py=y/rows*h;
    const d1=Math.hypot(px-s1x,py-s1y),d2=Math.hypot(px-s2x,py-s2y);
    const v=Math.sin(d1*freq-t*3)+Math.sin(d2*freq-t*3);
    if(Math.abs(v)<0.22*(1+e.bass*0.5)){
      g.fillStyle=Math.abs(v)<0.08?ic(0.5+e.beat*0.4):lc(0.32+e.high*0.4);
      g.fillRect(px,py,1.7,1.7);
    }
  }
  glow(16);g.strokeStyle=ic(0.5+e.beat*0.4);
  [[s1x,s1y],[s2x,s2y]].forEach(([x,y])=>{g.beginPath();g.arc(x,y,3+e.beat*4,0,Math.PI*2);g.stroke();});
  noglow();
}},

{cat:'Generative',name:'Chladni Muster',draw:(g,w,h,f,wv,t,e)=>{
  const m=3+Math.floor(e.bass*4),n=2+Math.floor(e.mid*4),cols=70,rows=Math.round(cols*h/w);
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const u=x/cols,v=y/rows;
    const val=Math.sin(m*Math.PI*u)*Math.sin(n*Math.PI*v)-Math.sin(n*Math.PI*u)*Math.sin(m*Math.PI*v);
    if(Math.abs(val)<0.08){g.fillStyle=lc(0.4+e.high*0.5);g.fillRect(x/cols*w,y/rows*h,1.8,1.8);}
  }
  glow(18);g.fillStyle=ic(0.4+e.beat*0.5);g.beginPath();g.arc(w/2,h/2,3+e.beat*5,0,Math.PI*2);g.fill();noglow();
}},

(()=>{
  const N=5,blobs=[];for(let i=0;i<N;i++)blobs.push({a:Math.random()*6.28,r:0.2+Math.random()*0.3,sp:0.3+Math.random()*0.4});

      if(sum>0.8&&sum<1.25){g.fillStyle=sum>1.05?ic(0.55+e.beat*0.4):lc(0.35+e.high*0.4);g.fillRect(px,py,1.7,1.7);}
    }

(()=>{

    const grid=[];for(let y=0;y<=rows;y++){grid.push([]);for(let x=0;x<=cols;x++)grid[y].push(nearest(x/cols*w,y/rows*h));}
    for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
      if(grid[y][x]!==grid[y][x+1]||grid[y][x]!==grid[y+1][x])g.fillRect(x/cols*w,y/rows*h,1.6,1.6);
    }
    glow(14);g.fillStyle=ic(0.5+e.beat*0.4);pts.forEach(([x,y])=>{g.beginPath();g.arc(x,y,2.5,0,Math.PI*2);g.fill();});
    noglow();
  }};
})(),

(()=>{
  const N=40,pts0=[];for(let i=0;i<N;i++)pts0.push({x:Math.random(),y:Math.random(),sx:(Math.random()-0.5)*0.15,sy:(Math.random()-0.5)*0.15});
  return {cat:'Generative',name:'Delaunay Mesh',draw:(g,w,h,f,wv,t,e)=>{
    const pts=pts0.map(p=>{const x=((p.x+Math.sin(t*p.sx+ROT*0.05)*0.02)%1+1)%1,y=((p.y+Math.cos(t*p.sy+ROT*0.05)*0.02)%1+1)%1;return[x*w,y*h];});
    g.lineWidth=0.8;g.strokeStyle=lc(0.16+e.mid*0.3);g.beginPath();
    for(let i=0;i<N;i++){
      let b0=-1,b1=-1,b2=-1,d0=1e18,d1=1e18,d2=1e18;
      for(let j=0;j<N;j++){if(j===i)continue;
        const d=(pts[i][0]-pts[j][0])**2+(pts[i][1]-pts[j][1])**2;
        if(d<d0){d2=d1;b2=b1;d1=d0;b1=b0;d0=d;b0=j;}else if(d<d1){d2=d1;b2=b1;d1=d;b1=j;}else if(d<d2){d2=d;b2=j;}}
      [b0,b1,b2].forEach(j=>{g.moveTo(pts[i][0],pts[i][1]);g.lineTo(pts[j][0],pts[j][1]);});
    }
    g.stroke();
    glow(12);g.fillStyle=ic(0.4+e.beat*0.4);pts.forEach(([x,y])=>{g.beginPath();g.arc(x,y,2+e.high*2,0,Math.PI*2);g.fill();});
    noglow();
  }};
})(),

{cat:'Generative',name:'Noise Konturen',draw:(g,w,h,f,wv,t,e)=>{

{cat:'Generative',name:'Reaktions-Diffusion',draw:(g,w,h,f,wv,t,e)=>{

(()=>{
  let px=0.1,py=0,pz=0;const trail=[];
  return {cat:'Generative',name:'Lorenz Attraktor',draw:(g,w,h,f,wv,t,e)=>{
    const cx=w/2,cy=h/2,foc=w*1.4,sigma=10,rho=28+e.bass*10,beta=8/3,dt=0.006;
    for(let i=0;i<3;i++){const dx=sigma*(py-px),dy=px*(rho-pz)-py,dz=px*py-beta*pz;px+=dx*dt;py+=dy*dt;pz+=dz*dt;}
    trail.push([px,py,pz]);if(trail.length>600)trail.shift();

      const[rx,ry,rz]=rot3(x*Math.min(w,h)*0.012,(y-25)*Math.min(w,h)*0.012,(z-25)*Math.min(w,h)*0.012,0.6,ROT*0.3);
      const[sx,sy]=proj(rx,ry,rz,cx,cy,foc);i?g.lineTo(sx,sy):g.moveTo(sx,sy);
    });
    g.strokeStyle=lc(0.35+e.mid*0.4);g.stroke();
    const last=trail[trail.length-1];

      const[rx,ry,rz]=rot3(last[0]*Math.min(w,h)*0.012,(last[1]-25)*Math.min(w,h)*0.012,(last[2]-25)*Math.min(w,h)*0.012,0.6,ROT*0.3);
      const[sx,sy]=proj(rx,ry,rz,cx,cy,foc);g.beginPath();g.arc(sx,sy,3+e.beat*4,0,Math.PI*2);g.fill();}

  }};
})(),

(()=>{
  let px=0.1,py=0.1;const trail=[];
  return {cat:'Generative',name:'Clifford Attraktor',draw:(g,w,h,f,wv,t,e)=>{

{cat:'Generative',name:'Moiré Gitter',draw:(g,w,h,f,wv,t,e)=>{

/* ---------- AUDIO ---------- */
function ensureCtx(){
  if(audioCtx)return;
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  analyser=audioCtx.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=0.8;
  gainNode=audioCtx.createGain();mediaDest=audioCtx.createMediaStreamDestination();
  analyser.connect(gainNode);gainNode.connect(audioCtx.destination);gainNode.connect(mediaDest);
  freqData=new Uint8Array(analyser.frequencyBinCount);waveData=new Uint8Array(analyser.frequencyBinCount);
}
async function loadFile(file){
  ensureCtx();trackName=file.name.replace(/\.[^.]+$/,'');statusEl.textContent='Dekodiere Audio…';
  const buf=await file.arrayBuffer();audioBuffer=await audioCtx.decodeAudioData(buf);
  pauseOffset=0;playing=false;playBtn.disabled=false;recBtn.disabled=false;seek.disabled=false;playBtn.textContent='▶ Play';
  dropHint.classList.add('hide');tDur.textContent=fmtTime(audioBuffer.duration);statusEl.textContent='Bereit · '+trackName;
  if(titleInput.value==='REALITÄTSFRAGMENTE')titleInput.value=trackName.toUpperCase();
}
function startPlayback(offset){
  sourceNode=audioCtx.createBufferSource();sourceNode.buffer=audioBuffer;sourceNode.connect(analyser);
  sourceNode.onended=()=>{if(playing&&audioCtx.currentTime-startTime+pauseOffset>=audioBuffer.duration-0.1){playing=false;pauseOffset=0;playBtn.textContent='▶ Play';}};
  sourceNode.start(0,offset);startTime=audioCtx.currentTime;
}
function togglePlay(){
  if(!audioBuffer)return;if(audioCtx.state==='suspended')audioCtx.resume();
  if(playing){pauseOffset+=audioCtx.currentTime-startTime;sourceNode.stop();playing=false;playBtn.textContent='▶ Play';}
  else{startPlayback(pauseOffset);playing=true;playBtn.textContent='❚❚ Pause';}
}

/* ---------- RENDER ---------- */
function render(){
  requestAnimationFrame(render);
  const t=performance.now()/1000;
  ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
  if(analyser){
    analyser.getByteFrequencyData(freqData);analyser.getByteTimeDomainData(waveData);
    const bass=avg(freqData,0,0.08)/255*userGain,mid=avg(freqData,0.08,0.4)/255*userGain,high=avg(freqData,0.4,1)/255*userGain;
    smoothBass+=(bass-smoothBass)*0.25;smoothMid+=(mid-smoothMid)*0.3;smoothHigh+=(high-smoothHigh)*0.35;
    beat*=0.9;if(smoothBass>0.45&&smoothBass>beat+0.15)beat=smoothBass;
    if(autoRotate)ROT+= 0.006 + smoothMid*0.02 + beat*0.012;
    const e={bass:smoothBass,mid:smoothMid,high:smoothHigh,beat:Math.min(beat,1)};
    ctx.lineJoin='round';ctx.lineCap='round';
    TEMPLATES[currentTpl].draw(ctx,W,H,freqData,waveData,t,e);
    noglow();
  }
  if(showGrain.checked)drawGrainVignette();
  if(showWordmark.checked)drawWordmark();
  if(playing&&audioBuffer){const pos=pauseOffset+(audioCtx.currentTime-startTime);seek.value=Math.min(1000,pos/audioBuffer.duration*1000);tCur.textContent=fmtTime(pos);}
}
function drawWordmark(){
  const pad=W*0.05;ctx.textBaseline='alphabetic';
  ctx.font=`700 ${W*0.028}px "Helvetica Neue",Arial`;ctx.fillStyle=lc(0.92);
  ctx.save();ctx.translate(pad,H-pad);ctx.letterSpacing=`${W*0.008}px`;ctx.fillText('SCHATTENTANZ',0,0);
  ctx.font=`400 ${W*0.02}px "Helvetica Neue",Arial`;ctx.fillStyle=ic(0.75);ctx.fillText(titleInput.value||'',0,-W*0.035);
  ctx.restore();ctx.globalAlpha=1;ctx.letterSpacing='0px';
}
let grainCanvas;
function drawGrainVignette(){
  const grad=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.75);
  grad.addColorStop(0,'rgba(0,0,0,0)');grad.addColorStop(1,'rgba(0,0,0,0.6)');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  if(!grainCanvas){grainCanvas=document.createElement('canvas');grainCanvas.width=grainCanvas.height=128;
    const gc=grainCanvas.getContext('2d'),id=gc.createImageData(128,128);
    for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=16;}gc.putImageData(id,0,0);}
  ctx.globalAlpha=0.5;const ox=Math.random()*128,oy=Math.random()*128,p=ctx.createPattern(grainCanvas,'repeat');
  ctx.save();ctx.translate(-ox,-oy);ctx.fillStyle=p;ctx.fillRect(0,0,W+128,H+128);ctx.restore();ctx.globalAlpha=1;
}

/* ---------- RECORD (webm/mp4 + auto-stop duration) ---------- */
let recorder,chunks=[],recording=false,recordDuration=0,recordTimer=null,useNativeMp4=false;

durSeg.onclick=e=>{if(e.target.dataset.dur===undefined)return;
  document.querySelectorAll('#durSeg button').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');recordDuration=parseInt(e.target.dataset.dur,10);};

function pickMime(){
  if(mp4Toggle.checked){
    const cands=['video/mp4;codecs=avc1,mp4a.40.2','video/mp4;codecs=h264,aac','video/mp4'];
    for(const c of cands)if(MediaRecorder.isTypeSupported(c)){useNativeMp4=true;return c;}
  }
  useNativeMp4=false;
  return MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';
}
function downloadBlob(blob,filename){const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function safeName(){return (trackName||'clip').replace(/\s+/g,'_');}

function toggleRecord(){
  if(!audioBuffer)return;
  if(recording){if(recordTimer){clearInterval(recordTimer);recordTimer=null;}recorder.stop();return;}
  const vStream=canvas.captureStream(30);
  const combined=new MediaStream([...vStream.getVideoTracks(),...mediaDest.stream.getAudioTracks()]);
  chunks=[];const mime=pickMime(),wantsMp4=mp4Toggle.checked;
  recorder=new MediaRecorder(combined,{mimeType:mime,videoBitsPerSecond:9000000});
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  recorder.onstop=async ()=>{
    recording=false;recBtn.classList.remove('active');recBtn.textContent='● Aufnahme starten';statusEl.classList.remove('rec');
    if(useNativeMp4){
      downloadBlob(new Blob(chunks,{type:'video/mp4'}),`schattentanz_${safeName()}.mp4`);
      statusEl.textContent='Video exportiert (.mp4)';
    }else{
      const webmBlob=new Blob(chunks,{type:'video/webm'});
      if(wantsMp4){
        try{
          const mp4Blob=await convertToMp4(webmBlob);
          downloadBlob(mp4Blob,`schattentanz_${safeName()}.mp4`);
          statusEl.textContent='Video exportiert (.mp4)';
        }catch(err){
          console.error(err);downloadBlob(webmBlob,`schattentanz_${safeName()}.webm`);
          statusEl.textContent='MP4-Konvertierung fehlgeschlagen — .webm exportiert';
        }
      }else{
        downloadBlob(webmBlob,`schattentanz_${safeName()}.webm`);
        statusEl.textContent='Video exportiert (.webm) · in CapCut ziehen zum Trimmen';
      }
    }
  };
  if(playing)togglePlay();pauseOffset=0;togglePlay();recorder.start();
  recording=true;recBtn.classList.add('active');recBtn.textContent='■ Aufnahme stoppen';statusEl.classList.add('rec');
  if(recordDuration>0){
    let remaining=recordDuration;statusEl.textContent=`● Aufnahme läuft — stoppt automatisch in ${remaining}s`;
    recordTimer=setInterval(()=>{
      remaining--;
      if(remaining<=0){clearInterval(recordTimer);recordTimer=null;if(recording)recorder.stop();}
      else statusEl.textContent=`● Aufnahme läuft — stoppt automatisch in ${remaining}s`;
    },1000);
  }else{
    statusEl.textContent='● Aufnahme läuft — stoppe wann du willst';
  }
}

/* ---------- MP4 CONVERSION (ffmpeg.wasm, loaded on demand) ---------- */
let ffmpegInstance=null;
async function convertToMp4(webmBlob){
  if(!ffmpegInstance){
    statusEl.textContent='Lade MP4-Encoder (ffmpeg.wasm, einmalig ~30MB)…';
    const ffmpegMod=await import('https://esm.sh/@ffmpeg/ffmpeg@0.12.10');
    const utilMod=await import('https://esm.sh/@ffmpeg/util@0.12.1');
    const ffmpeg=new ffmpegMod.FFmpeg();
    ffmpeg.on('progress',({progress})=>{statusEl.textContent=`Konvertiere zu MP4… ${Math.max(0,Math.min(100,Math.round(progress*100)))}%`;});
    const baseURL='https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm';
    await ffmpeg.load({
      coreURL:await utilMod.toBlobURL(`${baseURL}/ffmpeg-core.js`,'text/javascript'),
      wasmURL:await utilMod.toBlobURL(`${baseURL}/ffmpeg-core.wasm`,'application/wasm'),
    });
    ffmpegInstance={ffmpeg,fetchFile:utilMod.fetchFile};
  }
  const {ffmpeg,fetchFile}=ffmpegInstance;
  statusEl.textContent='Konvertiere zu MP4…';
  await ffmpeg.writeFile('in.webm',await fetchFile(webmBlob));
  await ffmpeg.exec(['-i','in.webm','-c:v','libx264','-preset','veryfast','-crf','20','-pix_fmt','yuv420p','-c:a','aac','out.mp4']);
  const data=await ffmpeg.readFile('out.mp4');
  await ffmpeg.deleteFile('in.webm');await ffmpeg.deleteFile('out.mp4');
  return new Blob([data.buffer],{type:'video/mp4'});
}

/* ---------- helpers ---------- */
function avg(arr,from,to){const a=Math.floor(arr.length*from),b=Math.floor(arr.length*to);let s=0;for(let i=a;i<b;i++)s+=arr[i];return s/(b-a||1);}
function fmtTime(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0');}
function setFormat(fmt){const f=FORMATS[fmt];canvas.width=f.w;canvas.height=f.h;W=f.w;H=f.h;
  const wrap=$('stageWrap'),availH=wrap.clientHeight-48,availW=wrap.clientWidth-48,scale=Math.min(availW/W,availH/H);
  canvas.style.width=(W*scale)+'px';canvas.style.height=(H*scale)+'px';}

/* ---------- PRESETS (localStorage) ---------- */
const PRESET_KEY='schattentanz_presets';
function loadPresets(){try{return JSON.parse(localStorage.getItem(PRESET_KEY)||'[]');}catch{return[];}}
function savePresets(list){localStorage.setItem(PRESET_KEY,JSON.stringify(list));}

function renderPresetList(){
  const list=loadPresets();presetListEl.innerHTML='';
  list.forEach((p,i)=>{
    const row=document.createElement('div');row.style.cssText='display:flex;align-items:center;gap:6px;font-size:12px';
    const label=document.createElement('span');label.textContent=p.name;
    label.style.cssText='flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)';
    const loadBtn=document.createElement('button');loadBtn.textContent='Laden';loadBtn.className='btn';
    loadBtn.style.cssText='width:auto;padding:5px 9px;font-size:10px';loadBtn.onclick=()=>applyPreset(p);
    const delBtn=document.createElement('button');delBtn.textContent='✕';delBtn.className='btn';
    delBtn.style.cssText='width:auto;padding:5px 9px;font-size:10px;color:var(--danger);border-color:var(--danger)';
    delBtn.onclick=()=>{const l=loadPresets();l.splice(i,1);savePresets(l);renderPresetList();};
    row.appendChild(label);row.appendChild(loadBtn);row.appendChild(delBtn);presetListEl.appendChild(row);
  });
}

function applyPreset(p){
  currentTpl=p.tplIndex;
  document.querySelectorAll('.tpl').forEach(el=>el.classList.toggle('active',+el.dataset.i===p.tplIndex));
  document.querySelectorAll('#fmtSeg button').forEach(b=>b.classList.toggle('active',b.dataset.fmt===p.format));
  setFormat(p.format);
  gainSlider.value=p.gain;userGain=p.gain/100;
  titleInput.value=p.title;
  $('glowOn').checked=p.glow;glowEnabled=p.glow;
  statusEl.textContent='Preset geladen · '+p.name;
}

presetSaveBtn.onclick=()=>{
  const name=presetNameInput.value.trim();if(!name)return;
  const activeFmt=document.querySelector('#fmtSeg button.active').dataset.fmt;
  const list=loadPresets();
  const preset={name,tplIndex:currentTpl,format:activeFmt,gain:gainSlider.value,title:titleInput.value,glow:glowEnabled};
  const existing=list.findIndex(p=>p.name===name);
  if(existing>=0)list[existing]=preset;else list.push(preset);
  savePresets(list);presetNameInput.value='';renderPresetList();
  statusEl.textContent='Preset gespeichert · '+name;
};
renderPresetList();

/* ---------- events ---------- */
const fileInput=$('fileInput');
$('loadBtn').onclick=()=>fileInput.click();dropHint.onclick=()=>fileInput.click();
fileInput.onchange=e=>{if(e.target.files[0])loadFile(e.target.files[0]);};
playBtn.onclick=togglePlay;recBtn.onclick=toggleRecord;
gainSlider.oninput=e=>userGain=e.target.value/100;
$('glowOn').onchange=e=>glowEnabled=e.target.checked;
$('autoRot').onchange=e=>autoRotate=e.target.checked;
seek.oninput=e=>{if(!audioBuffer)return;const pos=e.target.value/1000*audioBuffer.duration;
  if(playing){sourceNode.stop();pauseOffset=pos;startPlayback(pos);startTime=audioCtx.currentTime;}else pauseOffset=pos;tCur.textContent=fmtTime(pos);};
$('fmtSeg').onclick=e=>{if(e.target.dataset.fmt){document.querySelectorAll('#fmtSeg button').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');setFormat(e.target.dataset.fmt);}};
const wrap=$('stageWrap');
['dragover','dragenter'].forEach(ev=>wrap.addEventListener(ev,e=>{e.preventDefault();wrap.classList.add('dragover');}));
['dragleave','drop'].forEach(ev=>wrap.addEventListener(ev,e=>{e.preventDefault();wrap.classList.remove('dragover');}));
wrap.addEventListener('drop',e=>{const f=[...e.dataTransfer.files].find(f=>f.type.startsWith('audio'));if(f)loadFile(f);});
window.addEventListener('resize',()=>setFormat(document.querySelector('#fmtSeg button.active').dataset.fmt));
window.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();togglePlay();}});
setFormat('vertical');render();
</script>
</body>
</html>
