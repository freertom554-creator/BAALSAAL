<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baalsaal Map Editor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a; color: #ccc;
      font-family: 'Courier New', monospace;
      height: 100vh; overflow: hidden;
      display: flex; flex-direction: column;
      user-select: none;
    }
    /* ── TOOLBAR ── */
    #toolbar {
      background: #181818; border-bottom: 1px solid #2a2a2a;
      padding: 0 14px; display: flex; align-items: center;
      gap: 8px; flex-shrink: 0; height: 38px;
    }
    #toolbar h1 { font-size: 10px; letter-spacing: 5px; color: #3a3a3a; margin-right: 10px; white-space: nowrap; }
    .btn {
      background: #222; border: 1px solid #333; color: #888;
      padding: 4px 11px; font-family: inherit; font-size: 10px;
      cursor: pointer; letter-spacing: 1px; white-space: nowrap;
    }
    .btn:hover { background: #2c2c2c; color: #ddd; border-color: #555; }
    .btn.danger { border-color: #511; color: #a55; }
    .btn.danger:hover { background: #280f0f; color: #f77; }
    .tsep { width: 1px; height: 18px; background: #282828; }
    #hint { font-size: 9px; color: #2c2c2c; margin-left: auto; letter-spacing: 1px; }
    /* ── WORKSPACE ── */
    #workspace { display: flex; flex: 1; overflow: hidden; }
    /* ── SIDEBAR ── */
    #sidebar {
      width: 148px; min-width: 148px;
      background: #111; border-right: 1px solid #1e1e1e;
      overflow-y: auto; overflow-x: hidden; padding: 6px 5px;
    }
    #sidebar::-webkit-scrollbar { width: 3px; }
    #sidebar::-webkit-scrollbar-thumb { background: #2a2a2a; }
    .sbt {
      font-size: 8px; letter-spacing: 3px; color: #333; text-transform: uppercase;
      padding: 7px 3px 3px; border-bottom: 1px solid #1c1c1c; margin-bottom: 4px;
    }
    .sbt:not(:first-child) { margin-top: 8px; }
    .pal-room {
      padding: 4px 6px; margin-bottom: 3px;
      border: 1px solid #1e1e1e; border-left-width: 3px;
      cursor: grab; font-size: 9px; color: #999; border-radius: 1px;
    }
    .pal-room:hover { border-right-color: #444; border-top-color: #444; border-bottom-color: #444; color: #ccc; }
    .pal-item {
      display: flex; align-items: center; gap: 7px;
      padding: 4px 6px; margin-bottom: 3px;
      border: 1px solid #1e1e1e; cursor: grab; border-radius: 1px;
    }
    .pal-item:hover { border-color: #444; background: #161616; }
    .pal-item svg { flex-shrink: 0; }
    .pal-item .pil { font-size: 9px; color: #888; }
    /* ── CANVAS WRAP ── */
    #cw {
      flex: 1; overflow: auto;
      display: flex; align-items: flex-start; justify-content: flex-start;
      padding: 14px; background: #0b0b0b;
    }
    #cw::-webkit-scrollbar { width: 8px; height: 8px; }
    #cw::-webkit-scrollbar-thumb { background: #222; }
    /* ── CANVAS ── */
    #cv {
      width: 800px; height: 660px; position: relative;
      flex-shrink: 0; overflow: hidden;
      background-color: #111;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 20px 20px;
      outline: 1px solid #1e1e1e;
    }
    #cv.drop-hi { outline-color: #444; }
    /* ── PLACED ELEMENTS ── */
    .pel {
      position: absolute; cursor: move;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid rgba(255,255,255,0.45);
      min-width: 20px; min-height: 20px;
      transform-origin: center center;
    }
    .pel.room-el  { z-index: 2; }
    .pel.item-el  { z-index: 10; border-color: rgba(255,255,255,0.18); }
    .pel.selected { border-color: #ffff00 !important; z-index: 100 !important; }
    .rlbl {
      font-size: 10px; font-weight: bold; letter-spacing: 1px;
      color: rgba(255,255,255,0.75); text-align: center;
      pointer-events: none; line-height: 1.35; padding: 2px 3px;
      word-break: break-word; max-width: 100%;
    }
    .pel.item-el svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .ilbl {
      position: absolute; bottom: -13px; left: 50%; transform: translateX(-50%);
      font-size: 8px; color: #666; white-space: nowrap; pointer-events: none;
    }
    /* ── RESIZE HANDLES ── */
    .rh {
      position: absolute; width: 8px; height: 8px;
      background: #ddd; border: 1px solid #555; z-index: 20; display: none;
    }
    .pel.selected .rh { display: block; }
    .rh.nw { top:-4px; left:-4px; cursor:nw-resize; }
    .rh.ne { top:-4px; right:-4px; cursor:ne-resize; }
    .rh.sw { bottom:-4px; left:-4px; cursor:sw-resize; }
    .rh.se { bottom:-4px; right:-4px; cursor:se-resize; }
    /* ── ROTATE BUTTON ── */
    .rot-btn {
      position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
      background: #333; border: 1px solid #666; color: #ffcc00;
      font-size: 9px; padding: 1px 5px; cursor: pointer;
      display: none; white-space: nowrap; z-index: 30;
      font-family: 'Courier New', monospace; letter-spacing: 1px;
    }
    .pel.selected.item-el .rot-btn { display: block; }
    /* ── GHOST ── */
    #ghost {
      position: fixed; pointer-events: none; z-index: 9999; opacity: 0.6;
      border: 1px dashed #777; display: flex; align-items: center; justify-content: center;
      font-family: inherit; font-size: 9px; color: #aaa; background: #1a1a1a;
    }
    /* ── STATUS ── */
    #status {
      background: #111; border-top: 1px solid #1a1a1a;
      padding: 3px 14px; font-size: 9px; color: #333;
      letter-spacing: 1px; flex-shrink: 0; height: 22px;
      white-space: nowrap; overflow: hidden;
    }
  </style>
</head>
<body>
<div id="toolbar">
  <h1>BAALSAAL MAP EDITOR</h1>
  <div class="tsep"></div>
  <button class="btn" onclick="doExportJSON()">⬇ JSON</button>
  <button class="btn" onclick="doSaveImage()">⬇ PNG</button>
  <div class="tsep"></div>
  <button class="btn danger" onclick="doClearAll()">↺ Reset</button>
  <span id="hint">Ecken = skalieren &nbsp;·&nbsp; R = drehen &nbsp;·&nbsp; Entf = löschen &nbsp;·&nbsp; Items aus Sidebar ziehen</span>
</div>
<div id="workspace">
  <div id="sidebar">
    <div class="sbt">Räume</div>
    <div id="room-pal"></div>
    <div class="sbt">Items</div>
    <div id="item-pal"></div>
  </div>
  <div id="cw"><div id="cv"></div></div>
</div>
<div id="status">Layout geladen — verschieben, skalieren (Ecken), drehen (R-Taste) — dann JSON exportieren.</div>

<script>
/* ═══════════════════════════════════════════════════
   CONSTANTS
═══════════════════════════════════════════════════ */
const GRID=20, CW=800, CH=660, MIN=20;

/* ═══════════════════════════════════════════════════

/* ═══════════════════════════════════════════════════
   DEFINITIONS
═══════════════════════════════════════════════════ */
const ROOM_DEFS = [
  { type:'dancefloor',    label:'DANCEFLOOR',        color:'#091809', border:'#507a50' },
  { type:'flur1',         label:'FLUR 1',             color:'#141414', border:'#555'   },
  { type:'flur2',         label:'FLUR 2',             color:'#141414', border:'#555'   },
  { type:'eingang',       label:'EINGANGS-\nBEREICH', color:'#0c1520', border:'#3d6080'},
  { type:'garderobe',     label:'GARDEROBE',          color:'#0c0c1e', border:'#3d3d7a'},
  { type:'vorraum',       label:'TOILETTEN\nVORRAUM', color:'#161616', border:'#555'   },
  { type:'maennerwc',     label:'MÄNNER\nWC',         color:'#0a0a18', border:'#3a4a88'},
  { type:'frauenwc',      label:'FRAUEN\nWC',         color:'#180a16', border:'#883a60'},
  { type:'chillraum',     label:'CHILL-\nRAUM',       color:'#110b1a', border:'#664499'},
  { type:'treppehoch',    label:'TREPPE\nHOCH',       color:'#1c1408', border:'#996622'},
  { type:'treppenrunter', label:'TREPPEN\n↓ Eingang', color:'#181808', border:'#999933'},
];

const ITEM_DEFS = [
  { type:'djbooth',        label:'DJ Booth',         dw:80,  dh:55  },
  { type:'bar',            label:'Bar',              dw:120, dh:50  },
  { type:'sessel',         label:'Sessel',           dw:40,  dh:40  },
  { type:'fotobox',        label:'Fotobox',          dw:60,  dh:60  },
  { type:'bank',           label:'Bank',             dw:80,  dh:40  },
  { type:'holzbank',       label:'Holzbank/Kette',   dw:60,  dh:50  },
  { type:'bendix',         label:'Bendix',           dw:30,  dh:40  },
  { type:'tuersteher',     label:'Türsteher',        dw:30,  dh:40  },
  { type:'startpunkt',     label:'Startpunkt',       dw:40,  dh:40  },
  { type:'durchgang',      label:'Durchgang',        dw:60,  dh:20  },
  { type:'verbindungsflur',label:'Verbindungsflur',  dw:60,  dh:120 },
  { type:'sitzbanklang',   label:'Sitzbank lang',    dw:120, dh:15  },
  { type:'garderobemann',  label:'Garderobe',        dw:40,  dh:40  },
];

/* ═══════════════════════════════════════════════════
   INITIAL LAYOUT  — Stand vom Screenshot
   Räume + Items vorplatziert, bereit zum Feintuning
═══════════════════════════════════════════════════ */
const INITIAL_ROOMS = [
  // x    y    w    h
  { type:'dancefloor',    x: 40, y: 60, w:540, h:220 },
  { type:'garderobe',     x:620, y: 60, w:100, h: 60 },
  { type:'treppenrunter', x:720, y:340, w: 80, h:300 },
  { type:'eingang',       x:620, y:120, w:100, h:180 },
  { type:'flur1',         x: 40, y:300, w:640, h: 60 },
  { type:'flur2',         x:180, y:360, w: 60, h:160 },
  { type:'vorraum',       x:440, y:360, w:120, h: 80 },
  { type:'maennerwc',     x:440, y:440, w:120, h:100 },
  { type:'frauenwc',      x:560, y:360, w:120, h:180 },
  { type:'chillraum',     x: 80, y:480, w:200, h:160 },
  { type:'treppehoch',    x: 20, y:480, w: 60, h:160 },
];

const INITIAL_ITEMS = [
  // type              x    y    w    h   rot
  { type:'sessel',         x: 40, y: 80, w: 40, h: 40, rotation:  0 },
  { type:'sessel',         x: 40, y:140, w: 40, h: 40, rotation:  0 },
  { type:'sessel',         x: 40, y:200, w: 40, h: 40, rotation:  0 },
  { type:'djbooth',        x:180, y: 80, w:200, h:120, rotation:  0 },
  { type:'bar',            x:460, y:100, w:120, h: 80, rotation:  0 },
  { type:'durchgang',      x:160, y:280, w: 60, h: 20, rotation:  0 },
  { type:'durchgang',      x:160, y:380, w: 60, h: 20, rotation:  0 },
  { type:'fotobox',        x:440, y:360, w: 60, h: 60, rotation:  0 },
  { type:'durchgang',      x:440, y:460, w: 60, h: 20, rotation:  0 },
  { type:'holzbank',       x:100, y:520, w: 80, h: 40, rotation:  0 },
  { type:'holzbank',       x:140, y:560, w: 80, h: 40, rotation: 90 },
  { type:'bendix',         x: 20, y:540, w: 30, h: 40, rotation:  0 },
  { type:'durchgang',      x: 20, y:620, w: 60, h: 20, rotation:  0 },
  { type:'startpunkt',     x:720, y:620, w: 40, h: 40, rotation:  0 },
  { type:'tuersteher',     x:760, y:620, w: 30, h: 40, rotation:  0 },
];

/* ═══════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════ */
let state={rooms:[],items:[]}, nid=1, sel=null, dragState=null;

/* ═══════════════════════════════════════════════════
   UTILS
═══════════════════════════════════════════════════ */
const snap  = v => Math.round(v/GRID)*GRID;
const clamp = (v,lo,hi) => Math.max(lo,Math.min(hi,v));
const $     = id => document.getElementById(id);
const cv    = () => $('cv');
const st    = msg => $('status').textContent = msg;
const svgWrap = (type,w,h) =>
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="${w}" height="${h}">${ICONS[type]||''}</svg>`;

/* ═══════════════════════════════════════════════════
   BUILD SIDEBAR
═══════════════════════════════════════════════════ */
function buildSidebar() {
  const rp=$('room-pal');
  ROOM_DEFS.forEach(def=>{
    const d=document.createElement('div');
    d.className='pal-room';
    d.style.cssText=`background:${def.color};border-left-color:${def.border};`;
    d.textContent=def.label.replace('\n',' ');
    d.addEventListener('mousedown',e=>{e.preventDefault();startPalDrag(e,def,true);});
    rp.appendChild(d);
  });
  const ip=$('item-pal');
  ITEM_DEFS.forEach(def=>{
    const d=document.createElement('div');
    d.className='pal-item';
    d.innerHTML=`${svgWrap(def.type,22,22)}<span class="pil">${def.label}</span>`;
    d.addEventListener('mousedown',e=>{e.preventDefault();startPalDrag(e,def,false);});
    ip.appendChild(d);
  });
}

/* ═══════════════════════════════════════════════════
   PALETTE DRAG
═══════════════════════════════════════════════════ */
function startPalDrag(e,def,isRoom){
  const g=document.createElement('div');g.id='ghost';
  if(isRoom){
    g.style.cssText=`width:80px;height:36px;background:${def.color};border-color:${def.border};border-width:2px;`;
    g.textContent=def.label.replace('\n',' ');
  }else{
    g.style.cssText=`width:44px;height:44px;border-style:dashed;`;
    g.innerHTML=svgWrap(def.type,36,36);
  }
  posG(g,e.clientX,e.clientY);
  document.body.appendChild(g);
  dragState={mode:'place',def,isRoom,ghost:g};
  cv().classList.add('drop-hi');
  st(`"${def.label.replace('\n',' ')}" → auf Canvas loslassen`);
}
function posG(g,cx,cy){g.style.left=(cx-22)+'px';g.style.top=(cy-18)+'px';}

/* ═══════════════════════════════════════════════════
   DROP ON CANVAS
═══════════════════════════════════════════════════ */
function dropOnCanvas(def,isRoom,cx,cy){
  if(isRoom){
    const rd=ROOM_DEFS.find(r=>r.type===def.type);if(!rd)return;
    const dw=def.dw||160,dh=def.dh||120;
    const r={id:nid++,type:rd.type,label:rd.label,color:rd.color,border:rd.border,
      x:clamp(snap(cx-dw/2),0,CW-dw),y:clamp(snap(cy-dh/2),0,CH-dh),w:dw,h:dh};
    state.rooms.push(r);cv().appendChild(makeRoomEl(r));doSel(cv().lastChild);
    st(`Raum "${rd.label.replace('\n',' ')}" platziert.`);
  }else{
    const id=ITEM_DEFS.find(i=>i.type===def.type);if(!id)return;
    const it={id:nid++,type:def.type,label:def.label,rotation:0,
      x:clamp(snap(cx-id.dw/2),0,CW-id.dw),y:clamp(snap(cy-id.dh/2),0,CH-id.dh),w:id.dw,h:id.dh};
    state.items.push(it);cv().appendChild(makeItemEl(it));doSel(cv().lastChild);
    st(`Item "${def.label}" platziert.`);
  }
}

/* ═══════════════════════════════════════════════════
   MAKE DOM ELEMENTS
═══════════════════════════════════════════════════ */
function makeRoomEl(r){
  const el=document.createElement('div');
  el.className='pel room-el';el.dataset.id=r.id;el.dataset.kind='room';
  applyPel(el,r);
  const lbl=document.createElement('div');lbl.className='rlbl';
  r.label.split('\n').forEach((line,i)=>{if(i)lbl.appendChild(document.createElement('br'));lbl.appendChild(document.createTextNode(line));});
  el.appendChild(lbl);
  addHandles(el,r);
  el.addEventListener('mousedown',ev=>{
    if(ev.target.classList.contains('rh'))return;
    ev.preventDefault();doSel(el);startMove(ev,el,r);
  });
  return el;
}

function makeItemEl(it){
  const el=document.createElement('div');
  el.className='pel item-el';el.dataset.id=it.id;el.dataset.kind='item';
  applyPel(el,it);
  el.innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">${ICONS[it.type]||''}</svg>
    <div class="ilbl">${it.label}</div>
    <button class="rot-btn" title="R-Taste oder klicken">↻ R</button>`;
  el.querySelector('.rot-btn').addEventListener('mousedown',ev=>{
    ev.stopPropagation();ev.preventDefault();rotateItem(it,el);
  });
  addHandles(el,it);
  el.addEventListener('mousedown',ev=>{
    if(ev.target.classList.contains('rh')||ev.target.classList.contains('rot-btn'))return;
    ev.preventDefault();doSel(el);startMove(ev,el,it);
  });
  return el;
}

function applyPel(el,d){
  const rot=d.rotation||0;
  el.style.left=d.x+'px'; el.style.top=d.y+'px';
  el.style.width=d.w+'px'; el.style.height=d.h+'px';
  if(d.color) el.style.background=d.color;
  if(d.border) el.style.borderColor=d.border;
  el.style.transform=rot?`rotate(${rot}deg)`:'';
}

function addHandles(el,data){
  ['nw','ne','sw','se'].forEach(dir=>{
    const h=document.createElement('div');h.className='rh '+dir;
    h.addEventListener('mousedown',ev=>{ev.stopPropagation();ev.preventDefault();startResize(ev,el,data,dir);});
    el.appendChild(h);
  });
}

/* ═══════════════════════════════════════════════════
   SELECTION
═══════════════════════════════════════════════════ */
function doSel(el){
  if(sel)sel.classList.remove('selected');
  sel=el;
  if(!el){st('Klicke auf ein Element.');return;}
  el.classList.add('selected');
  const id=+el.dataset.id,kind=el.dataset.kind;
  const d=kind==='room'?state.rooms.find(r=>r.id===id):state.items.find(i=>i.id===id);
  const extra=kind==='item'?' · R = drehen':'';
  st(`► ${d?.label?.replace('\n',' ')}  ·  Ecken = skalieren${extra}  ·  Entf = löschen`);
}

/* ═══════════════════════════════════════════════════
   ROTATE
═══════════════════════════════════════════════════ */
function rotateItem(it,el){
  it.rotation=((it.rotation||0)+90)%360;
  el.style.transform=it.rotation?`rotate(${it.rotation}deg)`:'';
  st(`"${it.label}" → ${it.rotation}° (R nochmal für +90°)`);
}

/* ═══════════════════════════════════════════════════
   MOVE + RESIZE
═══════════════════════════════════════════════════ */
function startMove(e,el,data){
  dragState={mode:'move',el,data,sx:e.clientX,sy:e.clientY,ox:data.x,oy:data.y};
}
function startResize(e,el,data,handle){
  dragState={mode:'resize',el,data,handle,sx:e.clientX,sy:e.clientY,ox:data.x,oy:data.y,ow:data.w,oh:data.h};
}

/* ═══════════════════════════════════════════════════
   GLOBAL MOUSE
═══════════════════════════════════════════════════ */
document.addEventListener('mousemove',e=>{
  if(!dragState)return;const ds=dragState;
  if(ds.mode==='place'){posG(ds.ghost,e.clientX,e.clientY);return;}
  if(ds.mode==='move'){
    const dx=e.clientX-ds.sx,dy=e.clientY-ds.sy,d=ds.data;
    d.x=clamp(snap(ds.ox+dx),0,CW-d.w);d.y=clamp(snap(ds.oy+dy),0,CH-d.h);
    ds.el.style.left=d.x+'px';ds.el.style.top=d.y+'px';return;
  }
  if(ds.mode==='resize'){
    const dx=e.clientX-ds.sx,dy=e.clientY-ds.sy,h=ds.handle,d=ds.data;
    const R=ds.ox+ds.ow,B=ds.oy+ds.oh;
    let nx=ds.ox,ny=ds.oy,nr=R,nb=B;
    if(h.includes('e'))nr=Math.max(ds.ox+MIN,snap(R+dx));
    if(h.includes('s'))nb=Math.max(ds.oy+MIN,snap(B+dy));
    if(h.includes('w'))nx=Math.min(R-MIN,snap(ds.ox+dx));
    if(h.includes('n'))ny=Math.min(B-MIN,snap(ds.oy+dy));
    d.x=nx;d.y=ny;d.w=nr-nx;d.h=nb-ny;applyPel(ds.el,d);
  }
});

document.addEventListener('mouseup',e=>{
  if(!dragState)return;const ds=dragState;dragState=null;
  if(ds.mode==='place'){
    ds.ghost.remove();cv().classList.remove('drop-hi');
    const r=cv().getBoundingClientRect();
    if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)
      dropOnCanvas(ds.def,ds.isRoom,e.clientX-r.left,e.clientY-r.top);
    else st('Außerhalb des Canvas losgelassen.');
  }
});

cv().addEventListener('mousedown',e=>{
  if(e.target!==cv())return;
  if(sel){sel.classList.remove('selected');sel=null;}
  st('Klicke auf ein Element um es auszuwählen.');
});

/* ═══════════════════════════════════════════════════
   KEYBOARD
═══════════════════════════════════════════════════ */
document.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;

  // Delete
  if((e.key==='Delete'||e.key==='Backspace')&&sel){
    const id=+sel.dataset.id,kind=sel.dataset.kind;
    if(kind==='room')state.rooms=state.rooms.filter(r=>r.id!==id);
    else state.items=state.items.filter(i=>i.id!==id);
    sel.remove();sel=null;st('Element gelöscht.');
    return;
  }

  // Rotate (R) — items only
  if((e.key==='r'||e.key==='R')&&sel&&sel.dataset.kind==='item'){
    e.preventDefault();
    const id=+sel.dataset.id;
    const it=state.items.find(i=>i.id===id);
    if(it)rotateItem(it,sel);
  }
});

/* ═══════════════════════════════════════════════════
   TOOLBAR
═══════════════════════════════════════════════════ */
function doClearAll(){
  if(!confirm('Layout auf Startzustand zurücksetzen?'))return;
  state={rooms:[],items:[]};
  cv().querySelectorAll('.pel').forEach(el=>el.remove());
  sel=null;nid=1;
  initCanvas();
  st('Layout zurückgesetzt.');
}

function doExportJSON(){
  const out={
    rooms:state.rooms.map(r=>({id:r.id,type:r.type,label:r.label,x:r.x,y:r.y,w:r.w,h:r.h})),
    items:state.items.map(i=>({id:i.id,type:i.type,label:i.label,x:i.x,y:i.y,w:i.w,h:i.h,rotation:i.rotation||0})),
  };
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));
  a.download='baalsaal-map.json';a.click();
  st(`JSON exportiert — ${out.rooms.length} Räume, ${out.items.length} Items.`);
}

async function doSaveImage(){
  st('Rendere PNG...');
  const c=document.createElement('canvas');c.width=CW;c.height=CH;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#111';ctx.fillRect(0,0,CW,CH);
  ctx.strokeStyle='rgba(255,255,255,0.035)';ctx.lineWidth=1;
  for(let x=0;x<=CW;x+=GRID){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,CH);ctx.stroke();}
  for(let y=0;y<=CH;y+=GRID){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(CW,y);ctx.stroke();}
  state.rooms.forEach(r=>{
    ctx.fillStyle=r.color;ctx.fillRect(r.x,r.y,r.w,r.h);
    ctx.strokeStyle=r.border;ctx.lineWidth=2;ctx.strokeRect(r.x+1,r.y+1,r.w-2,r.h-2);
    ctx.fillStyle='rgba(255,255,255,0.78)';ctx.font='bold 10px monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    const lines=r.label.split('\n'),lh=14;
    const sy=r.y+r.h/2-(lines.length-1)*lh/2;
    lines.forEach((ln,i)=>ctx.fillText(ln,r.x+r.w/2,sy+i*lh));
  });
  for(const it of state.items){
    const rot=(it.rotation||0)*Math.PI/180;
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="${it.w}" height="${it.h}">${ICONS[it.type]||''}</svg>`;
    await new Promise(res=>{
      const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
      const img=new Image();
      img.onload=()=>{
        ctx.save();
        ctx.translate(it.x+it.w/2,it.y+it.h/2);
        if(rot)ctx.rotate(rot);
        ctx.drawImage(img,-it.w/2,-it.h/2,it.w,it.h);
        ctx.restore();
        URL.revokeObjectURL(url);res();
      };
      img.onerror=res;img.src=url;
    });
    ctx.fillStyle='#555';ctx.font='8px monospace';ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillText(it.label,it.x+it.w/2,it.y+it.h+2);
  }
  const a=document.createElement('a');a.href=c.toDataURL('image/png');
  a.download='baalsaal-map.png';a.click();
  st('PNG gespeichert.');
}

/* ═══════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════ */
function initCanvas(){
  INITIAL_ROOMS.forEach(init=>{
    const def=ROOM_DEFS.find(d=>d.type===init.type);if(!def)return;
    const r={id:nid++,...init,label:def.label,color:def.color,border:def.border};
    state.rooms.push(r);cv().appendChild(makeRoomEl(r));
  });
  INITIAL_ITEMS.forEach(init=>{
    const def=ITEM_DEFS.find(d=>d.type===init.type);if(!def)return;
    const it={id:nid++,...init,label:def.label};
    state.items.push(it);cv().appendChild(makeItemEl(it));
  });
}

buildSidebar();
initCanvas();
</script>
